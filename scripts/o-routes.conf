# Meeting sub-routing for `o m ...`
#
# One rule per line:   <bucket>: <keyword> [keyword ...]
# If the note's slug contains any listed keyword, it routes into
#   meetings/<bucket>/<yy-mm>/
# Rules are tried top to bottom; the FIRST match wins.
# A slug matching nothing falls back to meetings/other/<yy-mm>/.
# Lines starting with # and blank lines are ignored.

group:  group nordic
caplm:  caplm
1-1:    1-1
risk:   risk
cop:    cop
okr:    okr
